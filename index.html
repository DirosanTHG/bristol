<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bristol Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="title-row">
    <span class="balloon">📍</span>
    <h1>Bristol Trip</h1>
  </div>
  <div class="subtitle">Balloon Fiesta · 8–9 August 2026 · tap a pin for details</div>
  <div class="filters">
    <button class="pill active" data-cat="all">All 71</button>
    <button class="pill" data-cat="free"><span class="dot" style="background:#1E7A34"></span>Free</button>
    <button class="pill" data-cat="paid"><span class="dot" style="background:#E8720C"></span>Paid</button>
    <button class="pill" data-cat="food"><span class="dot" style="background:#7C3AED"></span>Food</button>
    <button class="pill" data-cat="boba"><span class="dot" style="background:#9A5B3C"></span>Bubble Tea</button>
    <button class="pill" data-cat="check"><span class="dot" style="background:#B8860B"></span>Double-check</button>
  </div>
</header>

<div id="map"></div>

<div class="legend">
  <b>Key</b>
  <div id="legendList"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
